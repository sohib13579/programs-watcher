# TEMP diagnostic: test Intigriti researcher API from a real runner IP.
name: ig-domain-debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install requests pyyaml
      - name: Inject secrets
        run: python .github/inject_secrets.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INTIGRITI_TOKEN: ${{ secrets.INTIGRITI_TOKEN }}
      - name: Domain fetch test
        run: |
          python - << 'PYEOF'
          import os, requests, yaml
          cfg = yaml.full_load(open("config.yml"))
          token = cfg.get("intigriti_token", "")
          H = {"Authorization": "Bearer " + token, "User-Agent": "Mozilla/5.0",
               "Accept": "application/json"}
          r = requests.get("https://api.intigriti.com/external/researcher/v1/programs",
                           params={"offset": 0, "limit": 500}, headers=H, timeout=30)
          body = r.json()
          items = body if isinstance(body, list) else body.get("records", [])
          print("researcher list:", r.status_code, "| items:", len(items), flush=True)
          picks = [i for i in items if i.get("handle") in
                   ("innovapost", "truelayer", "upcloud")][:3] + items[:2]
          for it in picks:
              rr = requests.get(
                  f"https://api.intigriti.com/external/researcher/v1/programs/{it['id']}",
                  headers=H, timeout=30)
              dm = rr.json().get("domains", {}) if rr.status_code == 200 else {}
              print(f"detail {it['handle']}: {rr.status_code} | domains: "
                    f"{len((dm or {}).get('content') or [])}", flush=True)
          PYEOF
