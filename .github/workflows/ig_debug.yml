# TEMP diagnostic: test Intigriti researcher API from a real runner IP.
name: ig-domain-debug
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install requests pyyaml
      - name: Inject secrets
        run: python .github/inject_secrets.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INTIGRITI_TOKEN: ${{ secrets.INTIGRITI_TOKEN }}
      - name: Domain fetch test
        run: |
          python - << 'PYEOF'
          import os, requests, yaml
          cfg = yaml.full_load(open("config.yml"))
          token = cfg.get("intigriti_token", "")
          print("token present:", bool(token), "| env:", bool(os.environ.get("INTIGRITI_TOKEN")))
          H = {"Authorization": "Bearer " + token, "User-Agent": "Mozilla/5.0",
               "Accept": "application/json"}
          # 1. researcher list — RAW body dump
          r = requests.get("https://api.intigriti.com/external/researcher/v1/programs",
                           params={"offset": 0, "limit": 500}, headers=H, timeout=30)
          print("researcher list:", r.status_code, "| raw head:", r.text[:400])
          # variants: different UA + no UA
          for ua in ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36",
                     "programs-watcher/1.0"):
              r2 = requests.get("https://api.intigriti.com/external/researcher/v1/programs",
                                params={"offset": 0, "limit": 5},
                                headers={"Authorization": "Bearer " + token,
                                         "User-Agent": ua, "Accept": "application/json"},
                                timeout=30)
              print(f"UA[{ua[:25]}]:", r2.status_code, "| raw:", r2.text[:200])
          # 2. detail for 5 programs known-good locally + 1 random
          for it in items[:5]:
              rr = requests.get(f"https://api.intigriti.com/external/researcher/v1/programs/{it['id']}",
                                headers=H, timeout=30)
              dm = rr.json().get("domains", {}) if rr.status_code == 200 else {}
              print(f"detail {it['handle']}: {rr.status_code} | domains: {len((dm or {}).get('content') or [])}")
          PYEOF
