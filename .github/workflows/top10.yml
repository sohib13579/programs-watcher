# Daily Top-10 report. The report itself is fired from INSIDE the watch
# chain (.github/maybe_top10.py) after 07:00 UTC once per day — no cron
# dependence. This workflow is kept for MANUAL runs only.
name: daily-top10
on:
  workflow_dispatch:
jobs:
  top10:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inject secrets into config.yml
        run: python .github/inject_secrets.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python top_targets.py
