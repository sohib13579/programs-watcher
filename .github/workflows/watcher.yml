# Runs the ORIGINAL programs-watcher code in the cloud, 24/7, free.
# State lives in MongoDB Atlas (M0 free tier) — nothing is committed here.
# Secrets needed (repo Settings > Secrets and variables > Actions):
#   DISCORD_WEBHOOK  – your Discord webhook URL
#   MONGO_URI        – your Atlas connection string (mongodb+srv://...)
name: programs-watcher
on:
  schedule:
    # 8 slots/hour (~every 8 min): GitHub drops some scheduled runs under
    # load, so redundancy keeps the effective detection latency <= ~15 min.
    # Public repo = unlimited free minutes.
    - cron: "3,11,19,27,35,43,51,59 * * * *"
  workflow_dispatch:
concurrency:
  group: watcher
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inject secrets into config.yml
        run: python .github/inject_secrets.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: python main.py
