# Self-retriggering watcher. GitHub's cron scheduler drops scheduled runs
# unpredictably, so instead of relying on it, ONE job runs ~21 checks in a
# loop (~15 min apart, ~5.5h) and then dispatches the next job itself via
# the API — bypassing the scheduler entirely. The twice-daily cron is only
# a bootstrap safety-net (chain_guard prevents duplicate chains).
name: programs-watcher
on:
  schedule:
    - cron: "13 1,13 * * *"   # bootstrap safety-net only
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inject secrets into config.yml
        run: python .github/inject_secrets.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          INTIGRITI_TOKEN: ${{ secrets.INTIGRITI_TOKEN }}
      - name: Chain guard (skip if a chain is already alive)
        id: guard
        run: python .github/chain_guard.py guard
        continue-on-error: true
      - name: Watch loop (~75 checks, ~5 min apart)
        if: steps.guard.outcome == 'success'
        run: |
          # Telegram listener: answers ONLY the operator (/start, /status);
          # strangers are silently ignored. Lives for the whole job.
          python .github/bot_listener.py > listener.log 2>&1 &
          LISTENER_PID=$!
          trap 'kill $LISTENER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 75); do
            echo "=== check $i/20 ==="
            # a dead listener means the operator's /start gets silence —
            # revive it every cycle and surface its last errors
            kill -0 $LISTENER_PID 2>/dev/null || {
              echo "[watchdog] listener died — restarting"
              tail -5 listener.log 2>/dev/null || true
              python .github/bot_listener.py >> listener.log 2>&1 &
              LISTENER_PID=$!
            }
            python main.py || echo "check failed (will retry next cycle)"
            python .github/maybe_top10.py || echo "top10 skipped/failed (retry next cycle)"
            python .github/chain_guard.py touch
            tail -2 listener.log 2>/dev/null || true
            if [ "$i" -lt 75 ]; then sleep 240; fi
          done
      - name: Re-arm next chain
        if: always() && steps.guard.outcome == 'success'
        run: gh workflow run watcher.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
