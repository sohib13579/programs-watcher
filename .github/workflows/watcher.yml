# Self-retriggering watcher. GitHub's cron scheduler drops scheduled runs
# unpredictably, so instead of relying on it, ONE job runs ~21 checks in a
# loop (~15 min apart, ~5.5h) and then dispatches the next job itself via
# the API — bypassing the scheduler entirely. The twice-daily cron is only
# a bootstrap safety-net (chain_guard prevents duplicate chains).
name: programs-watcher
on:
  schedule:
    - cron: "13 1,13 * * *"   # bootstrap safety-net only
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Inject secrets into config.yml
        run: python .github/inject_secrets.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Chain guard (skip if a chain is already alive)
        id: guard
        run: python .github/chain_guard.py guard
        continue-on-error: true
      - name: Watch loop (~20 checks, ~15 min apart)
        if: steps.guard.outcome == 'success'
        run: |
          for i in $(seq 1 20); do
            echo "=== check $i/20 ==="
            python main.py || echo "check failed (will retry next cycle)"
            python .github/maybe_top10.py || echo "top10 skipped/failed (retry next cycle)"
            python .github/chain_guard.py touch
            if [ "$i" -lt 20 ]; then sleep 860; fi
          done
      - name: Re-arm next chain
        if: always() && steps.guard.outcome == 'success'
        run: gh workflow run watcher.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
